<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Honk logo 方案</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.col{display:flex;flex-direction:column;align-items:center;gap:20px;flex:1}
.sizes{display:flex;align-items:flex-end;gap:18px}
.dark{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:#1c1c1e}
.word{display:flex;align-items:center;gap:12px}
.name{font-size:15px;font-weight:600;color:#1c1c1e}
.note{font-size:13px;line-height:19px;color:#6d6d72;text-align:center;max-width:300px;margin:0}
</style>
</helmet>
<div style="width:1200px;height:760px;box-sizing:border-box;padding:56px 48px;background:#ffffff;font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;display:flex;flex-direction:column;gap:40px">
  <div>
    <h1 style="margin:0;font-size:28px;font-weight:700;color:#000">Honk logo · 三个方向</h1>
    <p style="margin:6px 0 0;font-size:15px;color:#6d6d72">Honk 是鸣笛声。和 Bark 一样用拟声词起名，图形要在 29px 的设置图标里也能认出来。</p>
  </div>

  <div style="display:flex;gap:32px">
    <!-- A: bubble with a horn's sound -->
    <div class="col">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="方案 A：气泡鸣笛">
        <rect width="100" height="100" rx="22" fill="#0a6ed1"/>
        <path d="M30 26h24a10 10 0 0 1 10 10v14a10 10 0 0 1-10 10H43L31 70v-10h-1a10 10 0 0 1-10-10V36a10 10 0 0 1 10-10z" fill="#fff"/>
        <path d="M72 35a13 13 0 0 1 0 16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <path d="M80 28a24 24 0 0 1 0 30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
      </svg>
      <div class="sizes">
        <svg width="60" height="60" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0a6ed1"/><path d="M30 26h24a10 10 0 0 1 10 10v14a10 10 0 0 1-10 10H43L31 70v-10h-1a10 10 0 0 1-10-10V36a10 10 0 0 1 10-10z" fill="#fff"/><path d="M72 35a13 13 0 0 1 0 16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M80 28a24 24 0 0 1 0 30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/></svg>
        <svg width="29" height="29" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0a6ed1"/><path d="M30 26h24a10 10 0 0 1 10 10v14a10 10 0 0 1-10 10H43L31 70v-10h-1a10 10 0 0 1-10-10V36a10 10 0 0 1 10-10z" fill="#fff"/><path d="M72 35a13 13 0 0 1 0 16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>
      </div>
      <div class="dark">
        <svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0a6ed1"/><path d="M30 26h24a10 10 0 0 1 10 10v14a10 10 0 0 1-10 10H43L31 70v-10h-1a10 10 0 0 1-10-10V36a10 10 0 0 1 10-10z" fill="#fff"/><path d="M72 35a13 13 0 0 1 0 16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M80 28a24 24 0 0 1 0 30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/></svg>
        <span style="font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.3px">Honk</span>
      </div>
      <p class="name">A · 气泡鸣笛（推荐）</p>
      <p class="note">消息气泡加两道声波：一眼看出是"会响的消息"，和 App 里的会话界面同一种语言。小尺寸时去掉外圈声波仍然成立。</p>
    </div>

    <!-- B: a goose, the animal that honks -->
    <div class="col">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="方案 B：鹅">
        <rect width="100" height="100" rx="22" fill="#0a6ed1"/>
        <path d="M44 86V58c0-6-6-8-6-18a16 16 0 0 1 32 0" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M68 37l16 4-16 5z" fill="#ffb02e" stroke="#ffb02e" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="59" cy="36" r="2.6" fill="#0b2a4a"/>
      </svg>
      <div class="sizes">
        <svg width="60" height="60" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0a6ed1"/><path d="M44 86V58c0-6-6-8-6-18a16 16 0 0 1 32 0" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 37l16 4-16 5z" fill="#ffb02e" stroke="#ffb02e" stroke-width="3" stroke-linejoin="round"/><circle cx="59" cy="36" r="2.6" fill="#0b2a4a"/></svg>
        <svg width="29" height="29" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0a6ed1"/><path d="M44 86V58c0-6-6-8-6-18a16 16 0 0 1 32 0" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 37l16 4-16 5z" fill="#ffb02e" stroke="#ffb02e" stroke-width="4" stroke-linejoin="round"/></svg>
      </div>
      <div class="dark">
        <svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0a6ed1"/><path d="M44 86V58c0-6-6-8-6-18a16 16 0 0 1 32 0" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 37l16 4-16 5z" fill="#ffb02e" stroke="#ffb02e" stroke-width="3" stroke-linejoin="round"/><circle cx="59" cy="36" r="2.6" fill="#0b2a4a"/></svg>
        <span style="font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.3px">Honk</span>
      </div>
      <p class="name">B · 鹅</p>
      <p class="note">Honk 也是鹅叫。对应 Bark 的狗，有记忆点、带点趣味；但离"通知"的含义远一些，需要名字来解释。</p>
    </div>

    <!-- C: an H with a badge -->
    <div class="col">
      <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="方案 C：H 与角标">
        <rect width="100" height="100" rx="22" fill="#1c1c1e"/>
        <rect x="27" y="27" width="12" height="48" rx="6" fill="#fff"/>
        <rect x="57" y="27" width="12" height="48" rx="6" fill="#fff"/>
        <rect x="27" y="45" width="42" height="11" rx="5.5" fill="#fff"/>
        <circle cx="74" cy="27" r="11" fill="#ff5a36" stroke="#1c1c1e" stroke-width="4"/>
      </svg>
      <div class="sizes">
        <svg width="60" height="60" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1c1c1e"/><rect x="27" y="27" width="12" height="48" rx="6" fill="#fff"/><rect x="57" y="27" width="12" height="48" rx="6" fill="#fff"/><rect x="27" y="45" width="42" height="11" rx="5.5" fill="#fff"/><circle cx="74" cy="27" r="11" fill="#ff5a36" stroke="#1c1c1e" stroke-width="4"/></svg>
        <svg width="29" height="29" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1c1c1e"/><rect x="27" y="27" width="12" height="48" rx="6" fill="#fff"/><rect x="57" y="27" width="12" height="48" rx="6" fill="#fff"/><rect x="27" y="45" width="42" height="11" rx="5.5" fill="#fff"/><circle cx="74" cy="27" r="11" fill="#ff5a36" stroke="#1c1c1e" stroke-width="4"/></svg>
      </div>
      <div class="dark">
        <svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="2"/><rect x="27" y="27" width="12" height="48" rx="6" fill="#fff"/><rect x="57" y="27" width="12" height="48" rx="6" fill="#fff"/><rect x="27" y="45" width="42" height="11" rx="5.5" fill="#fff"/><circle cx="74" cy="27" r="11" fill="#ff5a36" stroke="#1c1c1e" stroke-width="4"/></svg>
        <span style="font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.3px">Honk</span>
      </div>
      <p class="name">C · H 加角标</p>
      <p class="note">字母 H 加未读角标，克制、偏工具感，和 berth、sluice 这类开发者产品放在一起协调；趣味性最弱。</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
