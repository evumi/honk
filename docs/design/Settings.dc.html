<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.cap{margin:22px 32px 6px;font-size:13px;color:#6d6d72}
.foot{margin:6px 32px 0;font-size:13px;line-height:18px;color:#6d6d72}
.sec{margin:0 16px;background:#fff;border-radius:12px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 16px;font-size:16px;color:#000;border:none;background:#fff;width:100%;box-sizing:border-box;font-family:inherit;text-align:left}
.it + .it{border-top:0.5px solid #e5e5ea}
.lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{color:#6d6d72;font-size:16px}
.chev{flex:none}
.ok{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#1a9e6e}
</style>

    <h1 style="margin:0;height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#000">设置</h1>
  </div>

  <p class="cap">推送</p>
  <div class="sec">
    <button type="button" class="it"><span class="lab">系统通知</span><span class="val">已开启</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="it"><span class="lab">设备注册</span><span class="val ok"><span class="dot"></span>已注册</span></div>
  </div>
  <p class="foot">通知被关闭时，消息仍会在打开 App 时同步过来。</p>

  <p class="cap">网关</p>
  <div class="sec">
    <button type="button" class="it"><span class="lab">honk.example.com</span><span class="val">更改</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <button type="button" class="it" style="color:#0a6ed1">立即同步</button>
  </div>

  <p class="cap">通用</p>
  <div class="sec">
    <button type="button" class="it"><span class="lab">语言</span><span class="val">跟随系统</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <p class="foot">跟随系统时，中文系统显示中文，其他语言显示英文。</p>

  <p style="position:absolute;left:0;right:0;bottom:118px;margin:0;text-align:center;font-size:13px;color:#6d6d72">Honk 1.0 (12)</p>
