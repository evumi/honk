# Builds the gateway's Docker image (linux/amd64 and linux/arm64) and pushes it
# to GitHub Container Registry as ghcr.io/<owner>/honk-gateway:
#   push to main  -> :main, :sha-<short>
#   tag v1.2.3    -> :1.2.3, :1.2, :latest
name: Gateway image

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-image.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go test -race ./...
        working-directory: gateway

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/honk-gateway
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: after a tag, pull the new image on the server and restart it.
  # Runs only when the GATEWAY_DEPLOY_HOST variable is set.
  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v') && vars.GATEWAY_DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.GATEWAY_DEPLOY_HOST }}
          username: ${{ vars.GATEWAY_DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.GATEWAY_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.GATEWAY_DEPLOY_PATH || '/opt/honk' }}
            export HONK_IMAGE_TAG=${{ github.ref_name }}
            export HONK_IMAGE_TAG=${HONK_IMAGE_TAG#v}
            docker compose pull
            docker compose up -d
            docker compose ps
