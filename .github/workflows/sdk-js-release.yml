# Publishes @evumi/honk (sdk/js) to npm on a sdk/js/v* tag. The tag must match
# package.json's version; prepublishOnly type-checks, tests and builds first.
# Needs the NPM_TOKEN secret (an automation token of the @evumi scope), or an
# npm trusted publisher set up for this workflow (that takes npm 11.5.1 or
# later, installed below).
name: SDK (npm) release

on:
  push:
    tags: ['sdk/js/v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - name: Tag matches the version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME#sdk/js/}"
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
