# Releases both SDKs from the repository's vX.Y.Z tag, the same tag that
# releases the gateway and the apps. Nothing in the source carries the version:
#
#   Go   the module lives in sdk/go, so Go wants its own tag sdk/go/vX.Y.Z;
#        this job pushes it at the same commit and has proxy.golang.org fetch
#        it, so `go get` and pkg.go.dev see it at once. honk.Version reads the
#        module version from the build.
#   npm  writes X.Y.Z into package.json and VERSION in src/index.ts, then
#        publishes @evumi/honk (prepublishOnly type-checks, tests and builds).
#        A pre-release (v1.2.0-rc.1) goes to the "next" dist-tag. Needs the
#        NPM_TOKEN secret (an automation token of the @evumi scope), or an npm
#        trusted publisher set up for this workflow (that takes npm 11.5.1 or
#        later, installed below).
#
# No GitHub Release is made here; gateway-release.yml makes the v* one.
name: SDK release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the sdk/go/v* tag
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - name: Version
        run: |
          case "$GITHUB_REF_NAME" in
            v0.*.* | v1.*.*) ;;
            # From v2 on Go needs the module path to end in /v2 (go.mod and
            # every import), which a tag alone cannot do.
            v[0-9]*.*.*) echo "$GITHUB_REF_NAME needs github.com/evumi/honk/sdk/go/v${GITHUB_REF_NAME%%.*} first" >&2; exit 1 ;;
            *) echo "bad tag $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
      - name: Test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...
      - name: Tag sdk/go/${{ github.ref_name }}
        run: |
          tag="sdk/go/$GITHUB_REF_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
      - name: Publish to the module proxy
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          cd "$RUNNER_TEMP" # outside any module
          # The proxy may not see a just-pushed tag for a little while.
          for i in 1 2 3 4 5; do
            go list -m -json "github.com/evumi/honk/sdk/go@$GITHUB_REF_NAME" && exit 0
            sleep $((i * 15))
          done
          exit 1

  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - name: Version
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad tag $GITHUB_REF_NAME" >&2; exit 1 ;; esac
          npm version "$version" --no-git-tag-version --allow-same-version
          sed -i "s/^export const VERSION = \".*\";$/export const VERSION = \"$version\";/" src/index.ts
          grep -qxF "export const VERSION = \"$version\";" src/index.ts
      - run: npm ci
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
