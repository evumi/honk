# Builds the signed release APK and attaches it to a GitHub Release, where it
# can be downloaded. A tag v1.2.3 makes release v1.2.3; a manual run makes a
# pre-release named after the run. Secrets and variables: docs/DEPLOY.zh-CN.md.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "versionName (default 0.1.0)"
        required: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check secrets and variables
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
          HONK_GATEWAY_URL: ${{ vars.HONK_GATEWAY_URL }}
        run: |
          # A release signed with a throwaway key could never be updated, and one
          # without google-services.json gets no pushes: refuse both.
          missing=""
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_GOOGLE_SERVICES_JSON_B64 HONK_GATEWAY_URL; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets or variables:$missing (see docs/DEPLOY.zh-CN.md)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check for the Android project
        run: |
          if [ ! -x android/gradlew ]; then
            echo "::error::android/gradlew is missing: the Android project is not in this commit yet"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # The CLI builds app/ into the APK's assets (preBuild runs
      # scripts/build-nsh-bundle.sh); without it the APK has no UI. Keep its
      # version equal to the embedded libraries'.
      - name: Install nsh
        run: curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.5.1 sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch the nsh Android libraries
        run: NSH_VERSION=v0.5.1 scripts/fetch-nsh-android.sh

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${INPUT_VERSION:-0.1.0}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Signing and Firebase files
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "$GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json

      - name: Build the nsh bundle
        run: |
          nsh --version
          scripts/build-nsh-bundle.sh

      - name: Assemble the release APK
        working-directory: android
        env:
          HONK_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          HONK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HONK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HONK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HONK_GATEWAY_URL: ${{ vars.HONK_GATEWAY_URL }}
          HONK_VERSION_NAME: ${{ steps.version.outputs.version }}
          HONK_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          src="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          dst="Honk-${{ steps.version.outputs.version }}-${{ steps.version.outputs.code }}.apk"
          cp "$src" "$dst"
          sha256sum "$dst" > "$dst.sha256"
          echo "file=$dst" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('android-build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Android build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" android/app/google-services.json
