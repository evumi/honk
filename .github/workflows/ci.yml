name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      ios: ${{ steps.filter.outputs.ios }}
      app: ${{ steps.filter.outputs.app }}
      assets: ${{ steps.filter.outputs.assets }}
      native: ${{ steps.filter.outputs.native }}
      android: ${{ steps.filter.outputs.android }}
      iosapp: ${{ steps.filter.outputs.iosapp }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'gateway/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/HonkKit/**'
              - 'app/src/host.contract.json'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
            native:
              - 'native/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'native/**'
              - 'app/**'
              - '.github/workflows/ci.yml'
            iosapp:
              - 'ios/**'
              - 'native/**'
              - 'app/**'
              - '.github/workflows/ci.yml'
            sdk:
              - 'sdk/**'
              - 'gateway/**'
              - 'app/src/e2e.vector.json'
              - '.github/workflows/ci.yml'
            assets:
              - 'ios/App/Assets.xcassets/**'
              - 'public/appstore/**'
              - 'scripts/brand/**'
              - 'scripts/check-app-store-assets.sh'
              - '.github/workflows/ci.yml'

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # The Go and TypeScript SDKs: unit tests, then end to end against a gateway
  # built from this commit (HONK_RELAY_URL=off, so nothing is pushed).
  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    env:
      HONK_E2E_GATEWAY: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - name: Start a gateway
        working-directory: gateway
        run: |
          go build -o "$RUNNER_TEMP/honk" ./cmd/honk
          HONK_ADDR=127.0.0.1:8080 HONK_DB="$RUNNER_TEMP/honk.db" HONK_RELAY_URL=off \
            nohup "$RUNNER_TEMP/honk" > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for _ in $(seq 50); do curl -fs "$HONK_E2E_GATEWAY/v1/info" && exit 0; sleep 0.2; done
          cat "$RUNNER_TEMP/gateway.log"; exit 1
      # The SDK on the oldest Go its go.mod allows, not the gateway's.
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - name: Go SDK
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...
      - name: TypeScript SDK
        working-directory: sdk/js
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - if: failure()
        run: cat "$RUNNER_TEMP/gateway.log"

  honkkit:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/HonkKit

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install longbridge/tap/nsh
      - run: nsh check App.tsx && nsh test
        working-directory: app

  assets:
    needs: changes
    if: needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-app-store-assets.sh

  # Card scripts: quickjs-ng and the card sandbox (C), with sanitizers and leak checks.
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ASan crashes at start on the runners' default mmap randomisation.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: make -C native check test asan

  # The iOS side of card scripts (native/Package.swift): CardHost on macOS.
  honkcard:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: native

  # :core's tests (CardHost through JNI on the JVM) and the app with libhonkcard.so.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      # AvatarIcons.kt is generated from the app's preset icons.
      - run: node ../scripts/gen-android-icons.mjs --check
      - name: Install nsh
        run: curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.5.1 sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: NSH_VERSION=v0.5.1 ../scripts/fetch-nsh-android.sh
      - run: ./gradlew :core:test :app:assembleDebug --no-daemon

  # The iOS app for the simulator (unsigned), with HonkCard linked in.
  iosapp:
    needs: changes
    if: needs.changes.outputs.iosapp == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen longbridge/tap/nsh
      - run: scripts/fetch-nsh-ios.sh
      - run: make -C ios project
      - run: >-
          xcodebuild -project ios/Honk.xcodeproj -scheme Honk -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO build
