# XcodeGen spec: `cd ios && make project` writes Honk.xcodeproj (not committed).
name: Honk
options:
  bundleIdPrefix: dev.evumi
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  HonkKit:
    path: HonkKit
  # Card scripts: quickjs-ng and the card sandbox, shared with Android (native/).
  HonkCard:
    path: ../native
targets:
  Honk:
    type: application
    platform: iOS
    # A shared scheme, so `xcodebuild -scheme Honk` works on CI.
    scheme: {}
    sources:
      - path: App
      - path: ../app/dist/nsh
        type: folder
        buildPhase: resources
    dependencies:
      - package: HonkKit
      - package: HonkCard
      - target: NotificationService
      - framework: Frameworks/NativeShell.xcframework
        embed: false
    # XcodeGen writes this file from `properties` on every run (with a path
    # alone it writes an empty dict); scripts/check-entitlements.sh guards it.
    entitlements:
      path: App/Honk.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - $(HONK_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HONK_KEYCHAIN_GROUP)
        com.apple.developer.usernotifications.communication: true
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Honk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIBackgroundModes: [remote-notification]
        NSUserActivityTypes: [INSendMessageIntent]
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        HonkGatewayURL: $(HONK_GATEWAY_URL)
        HonkAppGroup: $(HONK_APP_GROUP)
        HonkKeychainGroup: $(AppIdentifierPrefix)$(HONK_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HONK_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build nsh bundle
        script: ../scripts/build-nsh-bundle.sh
        basedOnDependencyAnalysis: false
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    dependencies:
      - package: HonkKit
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HONK_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HONK_KEYCHAIN_GROUP)
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Honk Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
          NSExtensionAttributes:
            IntentsSupported: [INSendMessageIntent]
        HonkGatewayURL: $(HONK_GATEWAY_URL)
        HonkAppGroup: $(HONK_APP_GROUP)
        HonkKeychainGroup: $(AppIdentifierPrefix)$(HONK_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HONK_BUNDLE_ID).NotificationService
        TARGETED_DEVICE_FAMILY: "1"
