# Run the gateway from the published image. Put the push credentials in
# ./secrets (not committed) and the settings in .env:
#   secrets/apns.p8   the APNs auth key (.p8)
#   secrets/fcm.json  the Firebase service account JSON
# Serve it behind a reverse proxy with HTTPS (see docs/DEPLOY.zh-CN.md).
services:
  honk:
    image: ghcr.io/evumi/honk-gateway:${HONK_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - honk-data:/data
      - ./secrets:/secrets:ro
    environment:
      HONK_APNS_KEY_FILE: /secrets/apns.p8
      HONK_APNS_KEY_ID: ${HONK_APNS_KEY_ID:?set HONK_APNS_KEY_ID}
      HONK_APNS_TEAM_ID: ${HONK_APNS_TEAM_ID:?set HONK_APNS_TEAM_ID}
      HONK_APNS_TOPIC: ${HONK_APNS_TOPIC:-dev.evumi.honk}
      HONK_APNS_SANDBOX: ${HONK_APNS_SANDBOX:-false}
      HONK_FCM_CREDENTIALS_FILE: /secrets/fcm.json
      HONK_MESSAGE_TTL: ${HONK_MESSAGE_TTL:-168h}
      # Push relay: set HONK_RELAY_SERVE=true to push for other (self-hosted)
      # gateways with the credentials above. HONK_PUSH_CONTENT: full or none.
      HONK_RELAY_SERVE: ${HONK_RELAY_SERVE:-}
      HONK_PUSH_CONTENT: ${HONK_PUSH_CONTENT:-}
      HONK_RELAY_RATE: ${HONK_RELAY_RATE:-}
      HONK_RELAY_BURST: ${HONK_RELAY_BURST:-}
      HONK_RELAY_TOKEN_PER_MINUTE: ${HONK_RELAY_TOKEN_PER_MINUTE:-}
      # Optional; empty means off or the default.
      HONK_REGISTER_KEY: ${HONK_REGISTER_KEY:-}
      HONK_LOG_FORMAT: ${HONK_LOG_FORMAT:-text}
      HONK_LOG_LEVEL: ${HONK_LOG_LEVEL:-info}

volumes:
  honk-data:
